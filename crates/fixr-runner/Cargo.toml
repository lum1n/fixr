[package]
name = "fixr-runner"
description = "fixr runner daemon: long-polls the Worker and launches coding agents through acc"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
license.workspace = true
publish.workspace = true

[[bin]]
name = "fixr-runner"
path = "src/main.rs"

[features]
# Runs a real Claude Code session against a throwaway repo; needs `claude` and network.
e2e = []

[dependencies]
fixr-client.workspace = true
acc-core = { git = "ssh://git@github.com/lum1n/acc.git", tag = "v0.3.0", features = ["host"] }
acc-ssh = { git = "ssh://git@github.com/lum1n/acc.git", tag = "v0.3.0", features = ["local"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
image.workspace = true
toml = "0.9"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.6"

[lints]
workspace = true
