[workspace]
resolver = "3"
members = ["crates/fixr-client", "crates/fixr-cli", "crates/fixr-runner", "crates/fixr-gpui"]
# fixr-gpui pulls in gpui; build it explicitly with `-p fixr-gpui`.
default-members = ["crates/fixr-client", "crates/fixr-cli", "crates/fixr-runner"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
fixr-client = { path = "crates/fixr-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
