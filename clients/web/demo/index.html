<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fixr web demo</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 32px; max-width: 760px; }
    .card { border: 1px solid #8884; border-radius: 12px; padding: 20px; margin: 16px 0; }
    .row { display: flex; gap: 8px; }
    .save { padding: 10px 18px; background: #2563eb; color: #fff; border: 0; border-radius: 8px; }
    .cancel { padding: 6px 14px; border: 1px solid #888; border-radius: 8px; background: none; color: inherit; }
    .secret { background: #f59e0b33; padding: 8px; border-radius: 6px; }
    #log { font: 12px ui-monospace, monospace; white-space: pre-wrap; background: #8881; padding: 8px; border-radius: 6px; min-height: 4em; }
    kbd { border: 1px solid #8886; border-radius: 4px; padding: 0 4px; }
  </style>
</head>
<body>
  <h1>Notes</h1>
  <p>Press <kbd>⌘/Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>F</kbd> or the button to report a UI issue.</p>
  <div class="card">
    <h2>Untitled</h2>
    <p>The Save button is taller than Cancel. Report it!</p>
    <div class="row"><button class="cancel">Cancel</button><button class="save">Save</button></div>
  </div>
  <p class="secret" data-fixr-ignore>This element has <code>data-fixr-ignore</code> and is left out of the screenshot.</p>
  <p><button id="report">Report a UI issue</button> <button id="flush">Flush queue</button></p>
  <div id="log" aria-live="polite"></div>

  <script src="../dist/fixr.global.js"></script>
  <script>
    // ?endpoint=http://localhost:8787&key=demo&capture=dom|display|none
    const q = new URLSearchParams(location.search);
    const log = document.getElementById("log");
    const fixr = Fixr.init({
      endpoint: q.get("endpoint") || "http://localhost:8787",
      projectKey: q.get("key") || "demo-key",
      capture: q.get("capture") || "dom",
      appVersion: "0.0.0-demo",
      metadata: () => ({ demo: "true", path: location.pathname }),
      // ?sdkHeader=0 drops X-Fixr-SDK for servers whose CORS allow-list lacks it.
      sdkHeader: q.get("sdkHeader") !== "0",
      onEvent: (e) => {
        (window.fixrEvents ||= []).push(e);
        log.textContent += JSON.stringify(e) + "\n";
      },
    });
    window.fixr = fixr;
    document.getElementById("report").onclick = () => fixr.open();
    document.getElementById("flush").onclick = () => fixr.flush();
  </script>
</body>
</html>
